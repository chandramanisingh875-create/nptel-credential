<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NPTEL National Registry Portal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f6f9; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 500px; 
            width: 90%; 
            box-sizing: border-box;
        }
        .btn { 
            background-color: #e67e22; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            text-transform: uppercase; 
        }
        .btn:hover { background-color: #d35400; }
        
        /* Layout Fix: Force hidden blocks to stay completely hidden initially */
        #loader-box { display: none; }
        #cert-box { display: none; }
        
        .loader { 
            border: 5px solid #f3f3f3; 
            border-top: 5px solid #e67e22; 
            border-radius: 50%; 
            width: 55px; 
            height: 55px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-badge { 
            background: #27ae60; 
            color: white; 
            padding: 12px 20px; 
            display: inline-block; 
            border-radius: 4px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            font-size: 16px;
        }
        .cert-wrapper {
            background: white; 
            padding: 20px; 
            border-radius: 6px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            display: inline-block;
            max-width: 95%;
        }
        img { 
            width: 100%; 
            height: auto; 
            border: 1px solid #ddd; 
        }
    </style>
    <script>
        function startVerification() {
            // Trigger Fullscreen Mode to completely hide the top URL bar
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }

            // Hide Welcome Screen, Show only Loading Box
            document.getElementById("welcome-box").style.display = "none";
            document.getElementById("loader-box").style.display = "block";

            // Wait 2.5 seconds, hide Loading Box, then show the Certificate cleanly
            setTimeout(function() {
                document.getElementById("loader-box").style.display = "none";
                document.getElementById("cert-box").style.display = "block";
            }, 2500);
        }
    </script>
</head>
<body>

    <!-- Step A: Welcome Gate -->
    <div id="welcome-box" class="container">
        <h2 style="color: #2c3e50; margin-top:0;">NPTEL E-Certificate Registry</h2>
        <p style="color: #7f8c8d; margin-bottom: 30px;">Secure Verification System Portal</p>
        <button class="btn" onclick="startVerification()">Verify Credentials</button>
    </div>

    <!-- Step B: Simulated Loading (URL becomes hidden here) -->
    <div id="loader-box" class="container">
        <div class="loader"></div>
        <h3 style="color: #2c3e50;">Verifying ID: NPTEL24ME11S443467203...</h3>
        <p style="color: #7f8c8d; margin-bottom:0;">Syncing with Central Certification Dataset Portal...</p>
    </div>

    <!-- Step C: Final Certificate Display -->
    <div id="cert-box">
        <div class="status-badge">✓ SUCCESS: AUTHENTIC CERTIFICATE VERIFIED</div>
        <br>
        <div class="cert-wrapper">
            <img src="my_certificate_image.png" alt="NPTEL Certificate">
        </div>
    </div>

</body>
</html>
